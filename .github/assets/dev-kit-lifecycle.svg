<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">dev-kit project lifecycle</title>
  <desc id="d">Four phases in a cycle: conception, planning, construction and stable. Construction runs the milestone loop on its own and stops once per planned release for your approval before production. A bug or improvement returns to construction; a scope change returns to conception.</desc>
  <style>
    .txt { fill: #1f2328; } .sub { fill: #57606a; } .ph { font-weight: 700; font-size: 17px; } .s { font-size: 12.5px; }
    .c1 { fill: #ede9fe; stroke: #8b5cf6; } .c2 { fill: #e0f2fe; stroke: #0ea5e9; } .c3 { fill: #fef3c7; stroke: #d97706; } .c4 { fill: #dcfce7; stroke: #16a34a; }
    .lvl { fill: #ffffff; stroke: #d0d7de; } .gate { fill: #fee2e2; stroke: #dc2626; } .gtxt { fill: #991b1b; font-weight: 700; }
    .ret { fill: none; stroke: #6e7781; stroke-width: 1.6; } .head { fill: #6e7781; } .lbl { fill: #57606a; font-size: 12px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .txt { fill: #e6edf3; } .sub, .lbl { fill: #9da7b3; }
      .c1 { fill: #2e1f5e; stroke: #a78bfa; } .c2 { fill: #0c2d48; stroke: #38bdf8; } .c3 { fill: #3d2a05; stroke: #f59e0b; } .c4 { fill: #0f3a22; stroke: #22c55e; }
      .lvl { fill: #161b22; stroke: #30363d; } .gate { fill: #4a1414; stroke: #f87171; } .gtxt { fill: #fecaca; }
      .ret { stroke: #8b949e; } .head { fill: #8b949e; }
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>

  <!-- phases as chevrons -->
  <path class="c1" stroke-width="1.5" d="M10,20 H215 L240,62 L215,104 H10 Z"/>
  <path class="c2" stroke-width="1.5" d="M222,20 H420 L445,62 L420,104 H222 L247,62 Z"/>
  <path class="c3" stroke-width="1.5" d="M427,20 H745 L770,62 L745,104 H427 L452,62 Z"/>
  <path class="c4" stroke-width="1.5" d="M752,20 H950 V104 H752 L777,62 Z"/>
  <text class="txt ph" x="28" y="52">1 · Conception</text>
  <text class="sub s" x="28" y="72">interview, PRD, architecture,</text>
  <text class="sub s" x="28" y="89">UX, UI · each reviewed</text>
  <text class="txt ph" x="262" y="52">2 · Planning</text>
  <text class="sub s" x="262" y="72">milestones grouped into</text>
  <text class="sub s" x="262" y="89">releases R1, R2…</text>
  <text class="txt ph" x="468" y="52">3 · Construction</text>
  <text class="sub s" x="468" y="72">milestone by milestone,</text>
  <text class="sub s" x="468" y="89">release by release</text>
  <text class="txt ph" x="796" y="52">4 · Stable</text>
  <text class="sub s" x="796" y="72">nothing open,</text>
  <text class="sub s" x="796" y="89">everything released</text>

  <!-- the two levels of construction -->
  <path class="ret" d="M598,104 V122"/>
  <rect class="lvl" x="300" y="124" width="596" height="44" rx="9" stroke-width="1.2"/>
  <text class="txt s" x="316" y="143" font-weight="700">Milestone loop · on its own</text>
  <text class="sub s" x="316" y="160">plan → build → QA &amp; fixes → smoke → deploy (when per milestone) → closed</text>
  <rect class="lvl" x="300" y="176" width="596" height="44" rx="9" stroke-width="1.2"/>
  <text class="txt s" x="316" y="195" font-weight="700">Release · when all its milestones are closed</text>
  <text class="sub s" x="316" y="212">audit → review →</text>
  <rect class="gate" x="434" y="199" width="104" height="19" rx="9.5" stroke-width="1.2"/>
  <text class="gtxt s" x="486" y="213" text-anchor="middle">your approval</text>
  <text class="sub s" x="546" y="212">→ production + smoke → released</text>
  <text class="lbl" x="316" y="238">rejected → a fixes milestone in the same release, and the loop runs again</text>

  <!-- the cycle back -->
  <path class="ret" d="M915,104 V280 H612 V230" marker-end="url(#a)"/>
  <text class="lbl" x="628" y="272">bug or improvement → construction</text>
  <path class="ret" d="M935,104 V306 H120 V112" marker-end="url(#a)"/>
  <text class="lbl" x="138" y="298">scope change → conception (and planning after it), while construction goes on</text>
</svg>
