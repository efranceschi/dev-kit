    <text class="s" x="380.0" y="488" text-anchor="middle">one commit per task</text>
    <text class="s" x="380.0" y="504" text-anchor="middle">--parallel: worktrees</text>
  </g>
  <g><rect class="par" x="505" y="434" width="190" height="82" rx="8"/>
    <text class="t" x="600.0" y="454" text-anchor="middle">QA</text>
    <text class="s" x="600.0" y="472" text-anchor="middle">auditors in parallel</text>
    <text class="s" x="600.0" y="488" text-anchor="middle">dev_score: 0-100</text>
    <text class="s" x="600.0" y="504" text-anchor="middle">per dimension</text>
  </g>
