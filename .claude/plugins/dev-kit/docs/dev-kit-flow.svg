  <text class="ph" x="72" y="850">4 · Stable</text>
  <text class="lbl" x="1136" y="848" text-anchor="end">and maintenance: nothing open, every milestone released; the next issue starts the cycle again</text>
  <g><rect class="ok" x="105" y="872" width="170" height="66" rx="8"/>
    <text class="t" x="190.0" y="892" text-anchor="middle">stable</text>
    <text class="s" x="190.0" y="910" text-anchor="middle">nothing open</text>
    <text class="s" x="190.0" y="926" text-anchor="middle"></text>
  </g>
  <g><rect class="step" x="305" y="872" width="210" height="66" rx="8"/>
    <text class="t" x="410.0" y="892" text-anchor="middle">production health</text>
    <text class="s" x="410.0" y="910" text-anchor="middle">prod-check every interval</text>
    <text class="s" x="410.0" y="926" text-anchor="middle">failure: an expedite issue</text>
  </g>
  <g><rect class="you" x="545" y="872" width="210" height="66" rx="8"/>
    <text class="t" x="650.0" y="892" text-anchor="middle">/dev-kit:issue</text>
    <text class="s" x="650.0" y="910" text-anchor="middle">classifies what happened</text>
    <text class="s" x="650.0" y="926" text-anchor="middle">(also from the board)</text>
  </g>
