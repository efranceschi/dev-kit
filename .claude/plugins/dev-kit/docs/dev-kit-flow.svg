  <rect class="side" x="50" y="1000" width="1100" height="66" rx="12"/>
  <text class="ph" x="72" y="1026">Anytime</text>
  <text class="s" x="170" y="1026">the board: Needs you (confirm, approve, Allow/Deny), live agents, forecast; its worker runs board requests on its own</text>
  <text class="s" x="170" y="1046">status, backlog, costs and feedback read .dev/ and the log · the steps drawn in yellow are yours</text>
</svg>
