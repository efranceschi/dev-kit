  <text class="ph" x="72" y="638">3 · Releases</text>
  <text class="lbl" x="1136" y="636" text-anchor="end">construction, when every milestone of the release has passed its gate</text>
  <g><rect class="step" x="105" y="650" width="150" height="66" rx="8"/>
    <text class="t" x="180.0" y="670" text-anchor="middle">usability, docs</text>
