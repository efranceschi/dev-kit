    <text class="s" x="170.0" y="114" text-anchor="middle">→ brief.md</text>
    <text class="s" x="170.0" y="130" text-anchor="middle">autonomy, deploy</text>
  </g>
  <g><rect class="step" x="255" y="76" width="130" height="66" rx="8"/>
