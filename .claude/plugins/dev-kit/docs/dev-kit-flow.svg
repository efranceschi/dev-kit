  <rect class="step" x="820" y="938" width="316" height="30" rx="8"/>
  <text class="t" x="832" y="958">change</text><text class="s" x="1124" y="958" text-anchor="end">the PRD, then a replan</text>
  <path class="arr" d="M755,905.0 C790,905.0 790,953 818,953" marker-end="url(#a)"/>
  <path class="amb" d="M1136,877 L1166,877 L1166,390 L380,390 L380,432" marker-end="url(#aa)"/>
  <path class="amb" d="M1136,915 L1166,915"/>
  <text class="lamb" x="1146" y="384" text-anchor="end">issues and flag cleanup chores</text>
