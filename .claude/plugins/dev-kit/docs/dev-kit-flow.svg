  <text class="lbl" x="1050" y="802" text-anchor="end">nothing open</text>
  <rect class="bad" x="820" y="862" width="316" height="30" rx="8"/>
  <text class="t" x="832" y="882">expedite</text><text class="s" x="1124" y="882" text-anchor="end">hotfix lane, patch release</text>
  <path class="arr" d="M755,905.0 C790,905.0 790,877 818,877" marker-end="url(#a)"/>
  <rect class="step" x="820" y="900" width="316" height="30" rx="8"/>
  <text class="t" x="832" y="920">standard</text><text class="s" x="1124" y="920" text-anchor="end">the next milestone</text>
