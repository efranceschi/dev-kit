    <text class="s" x="895.0" y="286" text-anchor="middle">state.json and IDs</text>
    <text class="s" x="895.0" y="302" text-anchor="middle">release flags created</text>
    <text class="s" x="895.0" y="318" text-anchor="middle"></text>
  </g>
