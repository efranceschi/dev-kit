<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1076" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">dev-kit flow</title>
  <desc id="desc">The dev-kit cycle in four phases. Conception: interview, PRD and its review, your confirmation of the PRD, architecture, UX and UI when there is an interface, and the design review. Planning: the plan groups milestones into releases, each milestone with an exit check, then the plan review and your confirmation. Construction, per milestone on its own: pull issues, implement with tests, QA with auditors in parallel, the gate (hard floor, exit check, cut-offs); a failed gate creates fix tasks, a passed one goes to smoke and an optional deploy, behind the release flag when flagged. Construction, per release: usability and docs, release audit, release review, your approval, production with the flag on, released; a rejection becomes a fixes milestone in the same release. Stable and maintenance: nothing open, the production health check runs, and each issue is classified: expedite becomes a hotfix, standard and intangible wait for the next milestone, a scope change reopens conception. Anytime: the board shows what needs you and runs board requests through its worker; status, backlog, costs and feedback read the log.</desc>
  <style>
    .lane { fill: #f6f8fa; stroke: #d0d7de; }
    .step { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .you { fill: #fff8c5; stroke: #bf8700; stroke-width: 1.4; }
    .par { fill: #fff1e5; stroke: #bc4c00; stroke-width: 1.2; }
    .ok { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.2; }
    .bad { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.2; }
    .side { fill: #fbefff; stroke: #8250df; stroke-width: 1.2; }
    .gate { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.6; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2328; }
    .s { font-size: 12px; fill: #57606a; }
    .gt { fill: #82071e; }
    .ph { font-size: 17px; font-weight: 700; fill: #1f2328; }
    .lbl { font-size: 12px; font-style: italic; fill: #57606a; }
    .lred { font-size: 12px; font-style: italic; fill: #cf222e; }
    .lamb { font-size: 12px; font-style: italic; fill: #9a6700; }
    .k1 { fill: #8250df; } .k2 { fill: #0969da; } .k3 { fill: #bc4c00; } .k4 { fill: #1a7f37; } .k5 { fill: #6e7781; }
    .arr { fill: none; stroke: #57606a; stroke-width: 1.5; }
    .red { fill: none; stroke: #cf222e; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .amb { fill: none; stroke: #9a6700; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .hd { fill: #57606a; } .hr { fill: #cf222e; } .ha { fill: #9a6700; }
    @media (prefers-color-scheme: dark) {
      .lane { fill: #161b22; stroke: #30363d; } .step { fill: #0d1117; stroke: #6e7681; }
      .you { fill: #3b2e00; stroke: #d29922; } .par { fill: #3d1d00; stroke: #db6d28; } .ok { fill: #0f2d1a; stroke: #3fb950; }
      .bad, .gate { fill: #3d0f12; stroke: #f85149; } .side { fill: #271052; stroke: #a371f7; }
      .t, .ph { fill: #e6edf3; } .s, .lbl { fill: #9da7b3; } .gt { fill: #ffdcd7; } .lred { fill: #ff7b72; } .lamb { fill: #d29922; }
      .arr { stroke: #9da7b3; } .hd { fill: #9da7b3; } .red { stroke: #ff7b72; } .hr { fill: #ff7b72; } .amb { stroke: #d29922; } .ha { fill: #d29922; }
    }
  </style>
