    <text class="s" x="1040.5" y="472" text-anchor="middle">when per milestone</text>
    <text class="s" x="1040.5" y="488" text-anchor="middle">flagged: flag off</text>
    <text class="s" x="1040.5" y="504" text-anchor="middle"></text>
