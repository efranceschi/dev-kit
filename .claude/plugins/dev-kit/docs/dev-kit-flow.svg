  <rect class="k3" x="50" y="398" width="7" height="180" rx="3.5"/>
  <text class="ph" x="72" y="422">3 · Milestones</text>
  <text class="lbl" x="1136" y="420" text-anchor="end">construction, M1, M2… in order: the next starts only after this gate passes</text>
  <g><rect class="step" x="105" y="434" width="150" height="82" rx="8"/>
    <text class="t" x="180.0" y="454" text-anchor="middle">pull issues</text>
