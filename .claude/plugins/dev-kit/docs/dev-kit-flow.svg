    <text class="t" x="708.0" y="760" text-anchor="middle">rejected</text>
    <text class="s" x="708.0" y="778" text-anchor="middle">a fixes milestone M&lt;k&gt;.&lt;i&gt; in the same release, back to the loop</text>
