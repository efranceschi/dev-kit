<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="board-token" content="__BOARD_TOKEN__">
  <script type="application/json" id="i18n-catalogs">__BOARD_I18N__</script>
  <meta name="color-scheme" content="dark light">
  <title>dev-kit · all projects</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/board.css">
  <link rel="stylesheet" href="/assets/spog.css">
  <script src="/assets/spog.js" defer></script>
</head>
<body class="spog">
  <a class="skip" href="#main" data-i18n="Skip to content">Skip to content</a>

  <header class="topbar" role="banner">
    <div class="brand">
      <img class="logo" src="/assets/favicon.svg" alt="">
      <div class="brand-text">
        <span class="kicker"><span data-i18n="dev-kit · every project">dev-kit · every project</span> <span class="kit-ver" id="kit-ver"></span></span>
        <h1 data-i18n="All projects">All projects</h1>
      </div>
    </div>

    <div class="top-mid">
      <span class="updated" id="updated" aria-live="off"></span>
    </div>

    <div class="top-actions">
      <span class="needs-btn calm" id="needs-total" role="status">
        <span class="needs-n" id="needs-n" aria-hidden="true">0</span><span class="needs-label" data-i18n="Needs you">Needs you</span><span class="visually-hidden" id="needs-sr"></span>
      </span>
      <span class="live" id="live"><span class="dot" aria-hidden="true"></span><span id="live-text" class="live-text" role="status" aria-live="polite" data-i18n-once="Connecting…">Connecting…</span></span>
      <button type="button" class="btn btn-icon" id="theme-btn" aria-label="Switch to light theme" title="Switch to light theme">
        <svg class="ico-sun" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="ico-moon" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <div class="pop-wrap">
        <button type="button" class="btn btn-icon" id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="menu-pop" aria-label="Options" data-i18n-aria-label="Options">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><circle cx="5" cy="12" r="1.9" fill="currentColor"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/><circle cx="19" cy="12" r="1.9" fill="currentColor"/></svg>
        </button>
        <div class="popover right" id="menu-pop" hidden>
          <p class="pop-title" id="theme-label" data-i18n="Theme">Theme</p>
          <p class="pop-note top" data-i18n="Auto follows your system setting.">Auto follows your system setting.</p>
          <div class="seg-switch" role="group" aria-labelledby="theme-label" id="theme-switch">
            <button type="button" class="seg-btn" data-theme-opt="auto" data-i18n="Auto">Auto</button>
            <button type="button" class="seg-btn" data-theme-opt="light" data-i18n="Light">Light</button>
            <button type="button" class="seg-btn" data-theme-opt="dark" data-i18n="Dark">Dark</button>
          </div>
          <p class="pop-title" id="lang-label" data-i18n="Language">Language</p>
          <div class="seg-switch" role="group" aria-labelledby="lang-label" id="lang-switch"></div>
          <hr>
          <button type="button" class="btn btn-danger wide" id="stop-btn">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            <span data-i18n="Stop server">Stop server</span>
          </button>
          <p class="pop-note" data-i18n="This page only shows your projects: every decision and run happens in Claude Code. It stops by itself when no tab is open.">This page only shows your projects: every decision and run happens in Claude Code. It stops by itself when no tab is open.</p>
        </div>
      </div>
    </div>
  </header>

  <nav class="spog-filter" aria-labelledby="filter-label">
    <span class="visually-hidden" id="filter-label" data-i18n="Show">Show</span>
    <div class="seg-switch" role="group" aria-labelledby="filter-label" id="filter"></div>
  </nav>

  <div class="banner" id="banner" role="alert" hidden></div>

  <main id="main" class="spog-main" tabindex="-1" aria-busy="true">
    <h2 class="visually-hidden" data-i18n="Projects">Projects</h2>
    <div class="spog-grid" id="projects"></div>
  </main>
</body>
</html>
